<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <style>
      svg {
        --ring-inner: rgba(212,168,83,0.08);
        --ring-mid: rgba(45,212,191,0.05);
        --ring-outer: transparent;
        --ring-stroke: rgba(212,168,83,0.12);
        --ring-stroke2: rgba(45,212,191,0.1);
        --shadow: rgba(0,0,0,0.25);
        --hub-bg: rgba(212,168,83,0.15);
        --hub-border: rgba(212,168,83,0.35);
        --hub-text: #d4a853;
        --hub-sub: #9d9bb8;
        --label-bg: #fff;
        --label-gold: #a07830;
        --label-teal: #0d7a6e;
      }
    </style>
    <radialGradient id="mBgRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--ring-inner, rgba(212,168,83,0.08))"/>
      <stop offset="55%" stop-color="var(--ring-mid, rgba(45,212,191,0.05))"/>
      <stop offset="100%" stop-color="var(--ring-outer, transparent)"/>
    </radialGradient>
    <linearGradient id="mSw1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#c49a45"/>
    </linearGradient>
    <linearGradient id="mSw2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a04a"/>
      <stop offset="100%" stop-color="#3dbda8"/>
    </linearGradient>
    <linearGradient id="mSw3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#24b8a5"/>
    </linearGradient>
    <linearGradient id="mSw4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#1fa892"/>
    </linearGradient>
    <linearGradient id="mSw5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3dbda8"/>
      <stop offset="100%" stop-color="#c9a04a"/>
    </linearGradient>
    <linearGradient id="mSw6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d4a853"/>
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="var(--shadow, rgba(0,0,0,0.25))"/>
    </filter>
    <filter id="mNodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="var(--shadow, rgba(0,0,0,0.2))"/>
    </filter>
  </defs>
  <circle cx="400" cy="400" r="360" fill="url(#mBgRing)"/>
  <circle cx="400" cy="400" r="300" fill="none" stroke="var(--ring-stroke, rgba(212,168,83,0.12))" stroke-width="1.5"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="var(--ring-stroke2, rgba(45,212,191,0.1))" stroke-width="1"/>
  <path d="M400 280 C 380 220, 340 180, 300 160" stroke="url(#mSw6)" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M480 310 C 540 270, 590 230, 620 190" stroke="url(#mSw1)" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M510 400 C 570 410, 620 440, 650 490" stroke="url(#mSw2)" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M460 480 C 480 540, 480 590, 460 640" stroke="url(#mSw3)" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M340 480 C 320 540, 280 590, 240 620" stroke="url(#mSw4)" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M290 400 C 230 390, 180 360, 150 310" stroke="url(#mSw5)" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.85"/>
