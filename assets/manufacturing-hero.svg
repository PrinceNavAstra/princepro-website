  <rect x="228" y="82" width="118" height="34" rx="17" fill="var(--label-bg, #fff)" stroke="#d4a853" stroke-width="1.5"/>
  <text x="287" y="104" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--label-gold, #a07830)">Quality Control</text>
  <g filter="url(#mNodeShadow)"><circle cx="620" cy="190" r="50" fill="#b8923f"/><g transform="translate(620,190)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -8 L-6 -16 L6 -8 L18 -16"/><path d="M-18 0 L-6 -8 L6 0 L18 -8"/><path d="M-18 8 L-6 0 L6 8 L18 0"/><circle cx="-18" cy="-8" r="3" fill="#fff" stroke="none"/><circle cx="-6" cy="-16" r="3" fill="#fff" stroke="none"/><circle cx="6" cy="-8" r="3" fill="#fff" stroke="none"/><circle cx="18" cy="-16" r="3" fill="#fff" stroke="none"/><circle cx="-18" cy="0" r="3" fill="#fff" stroke="none"/><circle cx="-6" cy="-8" r="3" fill="#fff" stroke="none"/><circle cx="6" cy="0" r="3" fill="#fff" stroke="none"/><circle cx="18" cy="-8" r="3" fill="#fff" stroke="none"/><circle cx="-18" cy="8" r="3" fill="#fff" stroke="none"/><circle cx="-6" cy="0" r="3" fill="#fff" stroke="none"/><circle cx="6" cy="8" r="3" fill="#fff" stroke="none"/><circle cx="18" cy="0" r="3" fill="#fff" stroke="none"/></g></g>
  <rect x="560" y="132" width="112" height="34" rx="17" fill="var(--label-bg, #fff)" stroke="#b8923f" stroke-width="1.5"/>
