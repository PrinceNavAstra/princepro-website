  <g filter="url(#mNodeShadow)"><circle cx="655" cy="495" r="50" fill="#2db8a4"/><g transform="translate(655,495)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-16" y="-12" width="32" height="24" rx="2"/><line x1="-16" y1="-4" x2="16" y2="-4"/><line x1="-16" y1="4" x2="16" y2="4"/><circle cx="-8" cy="8" r="3" fill="#fff" stroke="none"/><circle cx="0" cy="8" r="3" fill="#fff" stroke="none"/><circle cx="8" cy="8" r="3" fill="#fff" stroke="none"/><line x1="-4" y1="-4" x2="-4" y2="4"/><line x1="4" y1="-4" x2="4" y2="4"/></g></g>
  <rect x="598" y="558" width="108" height="34" rx="17" fill="var(--label-bg, #fff)" stroke="#2db8a4" stroke-width="1.5"/>
  <text x="652" y="580" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--label-teal, #0d7a6e)">Shop Floor</text>
  <g filter="url(#mNodeShadow)"><circle cx="460" cy="645" r="50" fill="#24b8a5"/><g transform="translate(460,645)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-18" y="-14" width="14" height="22" rx="2"/><rect x="-4" y="-10" width="14" height="18" rx="2"/><rect x="10" y="-16" width="14" height="26" rx="2"/><line x1="-11" y1="0" x2="-11" y2="8"/><line x1="3" y1="0" x2="3" y2="8"/><line x1="17" y1="0" x2="17" y2="10"/></g></g>
  <rect x="398" y="703" width="96" height="34" rx="17" fill="var(--label-bg, #fff)" stroke="#24b8a5" stroke-width="1.5"/>
  <text x="446" y="725" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--label-teal, #0d7a6e)">Inventory</text>
  <g filter="url(#mNodeShadow)"><circle cx="240" cy="625" r="50" fill="#3dbda8"/><g transform="translate(240,625)" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="16"/><path d="M0 -16 L4 -6 L16 -4 L8 4 L10 16 L0 10 L-10 16 L-8 4 L-16 -4 L-4 -6 Z"/><line x1="12" y1="12" x2="22" y2="22"/><circle cx="22" cy="22" r="4" fill="#fff" stroke="none"/></g></g>
  <rect x="175" y="635" width="124" height="34" rx="17" fill="var(--label-bg, #fff)" stroke="#3dbda8" stroke-width="1.5"/>
  <text x="237" y="657" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="var(--label-teal, #0d7a6e)">Maintenance</text>
