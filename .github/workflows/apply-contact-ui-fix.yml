name: Apply contact UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update contact cards and highlight contrast
        shell: python
        run: |
          from pathlib import Path

          path = Path("shared.css")
          css = path.read_text(encoding="utf-8")

          old = '''.qr-cards {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}'''
          new = '''.qr-cards {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  width: min(940px, calc(100vw - 32px));
  position: relative;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 8px;
}'''
          if old not in css:
              raise SystemExit("Expected .qr-cards block was not found")
          css = css.replace(old, new, 1)

          old = '''.qr-card {
  width: 300px;'''
          new = '''.qr-card {
  width: 450px;'''
          if old not in css:
              raise SystemExit("Expected .qr-card width was not found")
          css = css.replace(old, new, 1)

          old = '''[data-theme="dark"] mark::before,
[data-theme="dark"] .pp-highlight::before {
  background-color: rgba(212, 168, 83, 0.55);
}

[data-theme="light"] mark::before,
[data-theme="light"] .pp-highlight::before {
  background-color: rgba(184, 134, 46, 0.4);
}'''
          new = '''[data-theme="dark"] mark,
[data-theme="dark"] .pp-highlight {
  color: #fffdf5;
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.18);
}

[data-theme="dark"] mark::before,
[data-theme="dark"] .pp-highlight::before {
  background-color: rgba(184, 140, 60, 0.78);
}

[data-theme="light"] mark,
[data-theme="light"] .pp-highlight {
  color: #2a210f;
}

[data-theme="light"] mark::before,
[data-theme="light"] .pp-highlight::before {
  background-color: rgba(212, 168, 83, 0.52);
}'''
          if old not in css:
              raise SystemExit("Expected highlight theme rules were not found")
          css = css.replace(old, new, 1)

          marker = '''@media (max-width: 640px) {
  .qr-card {'''
          responsive = '''@media (max-width: 959px) and (min-width: 641px) {
  .qr-cards {
    width: calc(100vw - 32px);
  }

  .qr-card {
    width: calc(50% - 10px);
    min-width: 0;
  }
}

@media (max-width: 640px) {
  .qr-card {'''
          if marker not in css:
              raise SystemExit("Expected responsive QR card block was not found")
          css = css.replace(marker, responsive, 1)

          path.write_text(css, encoding="utf-8")

      - name: Commit changes and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.css
          git rm .github/workflows/apply-contact-ui-fix.yml
          git commit -m "Fix contact card sizing and theme highlight contrast"
          git push
