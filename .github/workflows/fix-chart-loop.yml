name: Fix financial chart observer loop
on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch observer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('financial-charts.js')
          s = p.read_text()
          old = """    var observer=new MutationObserver(function(){
      [['sip-chart','sip'],['loan-chart','loan']].forEach(function(pair){var c=document.getElementById(pair[0]);if(c&&c.dataset.ppChartReady)render(c,pair[1]);});
    });
    observer.observe(document.body,{subtree:true,childList:true});
"""
          new = """    // Observe only calculator table rows. Observing the whole body creates a render -> DOM mutation -> render loop.
    [['sip-progression-table','sip'],['loan-amortization-table','loan']].forEach(function(pair){
      var table=document.getElementById(pair[0]);
      if(!table) return;
      var tbody=table.querySelector('tbody');
      if(!tbody) return;
      new MutationObserver(function(){
        var c=document.getElementById(pair[0]==='sip-progression-table'?'sip-chart':'loan-chart');
        if(c&&c.dataset.ppChartReady) render(c,pair[1]);
      }).observe(tbody,{childList:true});
    });
"""
          if old not in s:
              raise SystemExit('Expected observer block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check financial-charts.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add financial-charts.js
          git diff --cached --quiet || git commit -m "Fix financial chart render loop"
          git push