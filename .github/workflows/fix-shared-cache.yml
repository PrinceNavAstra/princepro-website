name: Fix shared script cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared.js and refresh every HTML reference
        run: |
          node --check shared.js
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('src="shared.js"', 'src="shared.js?v=20260917-2"')
              s2 = s2.replace("src='shared.js'", "src='shared.js?v=20260917-2'")
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
                  print('updated', p)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Bust cached shared.js after syntax fix"
          git push
