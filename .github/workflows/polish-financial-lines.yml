name: Polish financial chart lines
on:
  push:
    paths:
      - '.github/workflows/polish-financial-lines.yml'
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix continuous chart lines and increase height
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('financial-tools-fix.js')
          s = p.read_text()
          s = s.replace('.pp-fin-chart__stage{height:390px;min-height:320px;', '.pp-fin-chart__stage{height:470px;min-height:360px;')
          s = s.replace('.pp-fin-chart__stage{height:330px;min-height:290px}', '.pp-fin-chart__stage{height:390px;min-height:320px}')
          s = s.replace("stroke-dasharray:1000;stroke-dashoffset:1000;animation:ppLineDraw 1.15s", "stroke-dasharray:1;stroke-dashoffset:1;animation:ppLineDraw 1.15s")
          s = s.replace("class:'pp-chart-line pp-chart-line-'+si,d:pts.map", "class:'pp-chart-line pp-chart-line-'+si,'pathLength':1,d:pts.map")
          p.write_text(s)
          PY
          node --check financial-tools-fix.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add financial-tools-fix.js
          git commit -m 'fix: keep financial chart lines continuous' || exit 0
          git push
