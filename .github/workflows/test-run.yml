name: Apply contact ticket polish
on:
  push:
    paths:
      - '.github/workflows/test-run.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local QR codes
        run: |
          npm init -y >/dev/null 2>&1
          npm install qrcode --silent
          node -e "const fs=require('fs'),q=require('qrcode'); Promise.all([q.toString('tel:+917043176485',{type:'svg',errorCorrectionLevel:'M',margin:2,color:{dark:'#111118',light:'#ffffff'}}).then(s=>fs.writeFileSync('qr-call.svg',s)),q.toString('mailto:prince679.pro@gmail.com',{type:'svg',errorCorrectionLevel:'M',margin:2,color:{dark:'#111118',light:'#ffffff'}}).then(s=>fs.writeFileSync('qr-mail.svg',s))]).catch(e=>{console.error(e);process.exit(1)})"
      - name: Patch contact markup and styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shared.js')
          s=p.read_text()
          s=s.replace('<div class="qr-wrap" id="qr-call"></div>','<div class="qr-wrap" id="qr-call"><img src="qr-call.svg" alt="QR code to call Prince Prajapati" loading="eager"></div>')
          s=s.replace('<div class="qr-wrap" id="qr-mail"></div>','<div class="qr-wrap" id="qr-mail"><img src="qr-mail.svg" alt="QR code to email Prince Prajapati" loading="eager"></div>')
          a=s.find('      function renderContactIcons(){')
          b=s.find('      renderContactIcons();',a)
          if a!=-1 and b!=-1:
              s=s[:a]+'      function renderContactIcons(){}\n      renderContactIcons();'+s[b+len('      renderContactIcons();'):]
          p.write_text(s)
          for hp in Path('.').glob('*.html'):
              t=hp.read_text()
              if 'contact-ticket.css' not in t:
                  hp.write_text(t.replace('</head>','<link rel="stylesheet" href="contact-ticket.css?v=20260917-2">\n</head>',1))
          PY
          node --check shared.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared.js contact-ticket.css qr-call.svg qr-mail.svg *.html
          git commit -m 'Apply consulting contact ticket polish and local QR codes' || exit 0
          git push
      - name: Verify
        run: |
          test -s qr-call.svg
          test -s qr-mail.svg
          test -s contact-ticket.css
          node --check shared.js
