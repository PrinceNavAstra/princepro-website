name: Apply premium industry hero
on:
  push:
    paths:
      - '.github/workflows/apply-industry-hero.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add industry hero stylesheet to all industry pages
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=['manufacturing.html','logistics.html','construction.html','marketing.html','textile.html']
          link='<link rel="stylesheet" href="industry-hero-modern.css?v=20260917-1">'
          for name in pages:
              p=Path(name)
              s=p.read_text()
              if link not in s:
                  marker='<link rel="stylesheet" href="industry.css" />'
                  if marker not in s:
                      raise SystemExit(f'Missing industry.css marker in {name}')
                  s=s.replace(marker, marker+'\n    '+link, 1)
                  p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manufacturing.html logistics.html construction.html marketing.html textile.html
          git commit -m 'feat: apply premium homepage-style industry heroes' || exit 0
