name: Load industry hero CSS

on:
  push:
    paths:
      - '.github/workflows/link-industry-hero.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add industry hero stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ['manufacturing.html','logistics.html','construction.html','marketing.html','textile.html']
          marker = 'industry-hero-fix.css?v=20260917-2'
          for name in pages:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if 'industry-hero-fix.css' in s:
                  import re
                  s = re.sub(r'<link rel="stylesheet" href="industry-hero-fix\.css[^>]*>', f'<link rel="stylesheet" href="{marker}">', s)
              else:
                  s = s.replace('<link rel="stylesheet" href="industry-fix.css?v=20260917-1">', '<link rel="stylesheet" href="industry-fix.css?v=20260917-1">\n    <link rel="stylesheet" href="' + marker + '">')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manufacturing.html logistics.html construction.html marketing.html textile.html
          git diff --cached --quiet || git commit -m "Apply homepage-style hero to industry pages"
          git push
