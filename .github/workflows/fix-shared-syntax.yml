name: Fix shared.js syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove extra shared.js closing brace
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shared.js')
          s = p.read_text(encoding='utf-8')
          old = "      renderQRCodes();\n      }\n    })();"
          new = "      renderQRCodes();\n    })();"
          if old not in s:
              raise SystemExit('Expected shared.js tail was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check shared.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.js
          git commit -m "Fix shared.js syntax error"
          git push
