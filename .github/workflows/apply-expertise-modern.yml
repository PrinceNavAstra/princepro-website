name: Apply expertise modern stylesheet
on:
  push:
    paths:
      - 'expertise-modern.css'
      - '.github/workflows/apply-expertise-modern.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add stylesheet to home page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='<link rel="stylesheet" href="expertise-modern.css?v=20260917-1">'
          if marker not in text:
              anchor='<link rel="stylesheet" href="shared.css" />'
              if anchor not in text:
                  raise SystemExit('shared.css anchor not found')
              text=text.replace(anchor, anchor+'\n  '+marker, 1)
              p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: enable expertise editorial layout'
          git push
