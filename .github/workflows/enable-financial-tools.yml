name: Enable financial tools

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enable:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add financial tools script to tool pages
        shell: python
        run: |
          from pathlib import Path
          files = ['index.html', 'sip-calculator.html', 'loan-calculator.html', 'ratios.html']
          marker = '<script src="financial-tools-fix.js"></script>'
          changed = []
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if marker not in s and '</body>' in s:
                  s = s.replace('</body>', '  ' + marker + '\n</body>', 1)
                  p.write_text(s, encoding='utf-8')
                  changed.append(name)
          print('Updated:', ', '.join(changed))
          Path('.github/workflows/enable-financial-tools.yml').unlink()
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sip-calculator.html loan-calculator.html ratios.html financial-tools-fix.js .github/workflows/enable-financial-tools.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: make financial tools buttons functional"
          git push origin HEAD:main
