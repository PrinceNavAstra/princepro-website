name: Inspect expertise section
on:
  push:
    paths:
      - '.github/workflows/inspect-expertise.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify expertise stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          marker='expertise-modern.css?v=20260917-1'
          print('EXPERTISE_STYLESHEET_PRESENT=', marker in text)
          if marker not in text:
              raise SystemExit('Expertise stylesheet link missing from index.html')
          print('index_sha_bytes=', len(text.encode('utf-8')))
          PY
