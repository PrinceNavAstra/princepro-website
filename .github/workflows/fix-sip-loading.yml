name: Fix SIP page loading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shared QR loading and calculator hero spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          shared = Path('shared.js')
          text = shared.read_text(encoding='utf-8')
          old = re.search(r"      function renderQRCodes\(\) \{.*?\n      \}\n\n      if \(typeof QRCode === 'undefined'\) \{.*?\n      \} else \{\n        renderQRCodes\(\);\n      \}", text, re.S)
          if old:
              replacement = '''      function renderQRCodes() {
        var callEl = document.getElementById('qr-call');
        var mailEl = document.getElementById('qr-mail');
        if (callEl && !callEl.hasChildNodes()) {
          callEl.innerHTML = '<img src="qr-call.svg" width="54" height="54" alt="QR code to call Prince Prajapati" loading="eager">';
        }
        if (mailEl && !mailEl.hasChildNodes()) {
          mailEl.innerHTML = '<img src="qr-mail.svg" width="54" height="54" alt="QR code to email Prince Prajapati" loading="eager">';
        }
      }

      renderQRCodes();'''
              text = text[:old.start()] + replacement + text[old.end():]
              shared.write_text(text, encoding='utf-8')

          css = Path('products.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace('  min-height: 65vh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 120px 0 100px;', '  min-height: 34vh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 78px 0 58px;', 1)
          css.write_text(c, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.js products.css
          git diff --cached --quiet || git commit -m "Fix calculator loading and hero spacing"
          git push
