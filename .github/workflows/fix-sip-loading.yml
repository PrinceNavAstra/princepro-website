name: Fix SIP page loading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator page
        run: |
          python -c "from pathlib import Path; p=Path('shared.js'); s=p.read_text(); a=s.find(\"      if (typeof QRCode === 'undefined') {\"); b=s.find(\"      }\\n    })();\",a); assert a>=0 and b>=0; p.write_text(s[:a]+'      renderQRCodes();\\n'+s[b:])"
          python -c "from pathlib import Path; p=Path('products.css'); s=p.read_text(); old='  min-height: 65vh;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n  padding: 120px 0 100px;'; new='  min-height: 34vh;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n  padding: 78px 0 58px;'; assert old in s; p.write_text(s.replace(old,new,1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.js products.css
          git diff --cached --quiet || git commit -m "Fix calculator loading and hero spacing"
          git push
