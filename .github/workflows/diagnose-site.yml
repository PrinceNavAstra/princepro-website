name: Diagnose site loading

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check shared.js
          node --check products.js
          node --check financial-tools-fix.js
          node --check financial-charts.js
      - name: Check production routes
        run: |
          set -eux
          for url in \
            https://princepro-website.vercel.app/ \
            https://princepro-website.vercel.app/sip-calculator \
            https://princepro-website.vercel.app/loan-calculator \
            https://princepro-website.vercel.app/ratios \
            https://princepro-website.vercel.app/manufacturing; do
            echo "===== $url ====="
            curl -L --max-time 20 -sS -o /tmp/page.html -w 'HTTP=%{http_code} FINAL=%{url_effective} TIME=%{time_total}\n' "$url"
            grep -o '<title>[^<]*</title>' /tmp/page.html | head -1 || true
          done
      - name: Check referenced local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          missing = []
          for html in root.glob('*.html'):
              text = html.read_text(encoding='utf-8', errors='ignore')
              for attr in ('src','href'):
                  for ref in re.findall(r'\b'+attr+r'=[\"\']([^\"\']+)[\"\']', text):
                      if ref.startswith(('#','http:','https:','mailto:','tel:','javascript:')):
                          continue
                      ref = ref.split('?',1)[0].split('#',1)[0]
                      p = (html.parent / ref).resolve()
                      if not p.exists():
                          missing.append(f'{html.name}: {ref}')
          if missing:
              print('MISSING LOCAL REFERENCES:')
              print('\n'.join(missing))
              raise SystemExit(1)
          print('All local HTML references resolve.')
          PY
