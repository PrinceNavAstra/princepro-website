name: Fix site favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-favicon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace favicon setup
        shell: python
        run: |
          from pathlib import Path
          import re

          # One crisp, theme-independent SVG favicon so the icon stays readable
          # in both light and dark browser chrome.
          svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prince Prajapati">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f0c878"/>
                <stop offset="1" stop-color="#b8862e"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="15" fill="#0b0b13"/>
            <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#d4a853" stroke-opacity=".55" stroke-width="2"/>
            <text x="32" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" letter-spacing="-2" fill="url(#g)">PP</text>
            <circle cx="32" cy="15" r="2.5" fill="#2dd4bf"/>
          </svg>
          '''
          Path('favicon.svg').write_text(svg.strip() + '\n', encoding='utf-8')

          # Normalize favicon references on every HTML entry point.
          favicon_block = '''  <link rel="icon" type="image/svg+xml" href="favicon.svg" id="favicon-main" />
            <link rel="shortcut icon" href="favicon.svg" />
            <link rel="apple-touch-icon" href="favicon.svg" id="favicon-apple" />'''
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              # Replace the existing light/dark/default favicon block when present.
              pattern = r'\s*<!-- Light theme favicons -->.*?\s*<link rel="apple-touch-icon" href="favicon-light-128\.png" id="favicon-apple" />'
              new_text, count = re.subn(pattern, '\n' + favicon_block, text, count=1, flags=re.S)
              if count == 0:
                  # Fallback for pages whose favicon markup differs.
                  new_text = re.sub(r'\s*<link[^>]+rel=["\'](?:icon|shortcut icon|apple-touch-icon)["\'][^>]*>', '', text, flags=re.I)
                  new_text = new_text.replace('</head>', '\n' + favicon_block + '\n</head>', 1)
              path.write_text(new_text, encoding='utf-8')

          # Keep shared.js compatible with the existing theme-toggle code, but
          # make every theme use the same crisp SVG favicon.
          js_path = Path('shared.js')
          js = js_path.read_text(encoding='utf-8')
          replacement = '''function updateFavicon(theme) {
        var icon = 'favicon.svg';
        var main = document.getElementById('favicon-main');
        var apple = document.getElementById('favicon-apple');
        if (main) main.href = icon;
        if (apple) apple.href = icon;
      }'''
          js, count = re.subn(r'function updateFavicon\(theme\) \{.*?\n      \}', replacement, js, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate updateFavicon() in shared.js')
          js_path.write_text(js, encoding='utf-8')

          # This workflow is only a one-time migration helper; remove it from
          # the repository after applying the changes.
          Path('.github/workflows/fix-favicon.yml').unlink()

      - name: Commit favicon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.svg shared.js '*.html' .github/workflows/fix-favicon.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: update site favicons"
          git push origin HEAD:main
